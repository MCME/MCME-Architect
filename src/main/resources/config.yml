# /rp release runs a resource pack's release script. timeoutMinutes (optional, per pack) is how long the script may run
# before Architect stops it: 30 by default.
gitHubRpReleases:
    Human:
        owner: EriolEandur
        repo: RP-Gondor
        script: releaseVanillaSodium.sh
        path: /opt/mcme-network/bungee-mcme/servers-mcme/devserver/resourcePackAutomation/
        separateSodium: true
    Dwarf:
        owner: EriolEandur
        repo: RP-Moria
        script: releaseGeneral.sh
        path: /opt/mcme-network/bungee-mcme/servers-mcme/devserver/resourcePackAutomation/
    Rohan:
        owner: EriolEandur
        repo: RP-Rohan
        script: releaseGeneral.sh
        path: /opt/mcme-network/bungee-mcme/servers-mcme/devserver/resourcePackAutomation/
inventoryDownload:
    script: updateInventory.sh
    path: /opt/mcme-network/bungee-mcme/servers-mcme/devserver/resourcePackAutomation/
logging:
    file:
        enabled: true
        alsoServerLog: false
        maxSizeMB: 10
        maxFiles: 5
        retentionDays: 14
biomeTuning:
    # Live biome tuning (/biometune): undo steps kept per biome, and backups kept per biome file.
    undoDepth: 20
    backupsPerBiome: 20
    # Spare biomes, which builders claim with /biometune claim or the editor's New biome button: ids such as
    # mcme:custom_001. sparePattern is the namespace, a colon, the prefix, then one # per digit (1 to 9 of them),
    # in lower-case letters, digits, _, - and . (and / in the prefix).
    # /biometune spares add writes new spares into targetPack, a pack folder in the world's datapacks folder (its
    # name: letters, digits, _, - and ., not dots alone), which must already exist with a pack.mcmeta (Paper 26.2 no
    # longer makes the bukkit pack; older worlds have one). The labels of all biomes are kept in that pack too, in
    # mcme-biometune.json, which also records which spares are claimed. Only the one in targetPack is read, so a new
    # targetPack frees every claimed spare: when you move to another pack, move mcme-biometune.json with the biomes.
    sparePattern: 'mcme:custom_###'
    targetPack: bukkit
    refresh:
        # Seconds between two previews by the same builder.
        cooldownSeconds: 5
        # A refresh that has not finished after this many seconds ends with a "please rejoin" disconnect.
        timeoutSeconds: 15
        # Publish refreshes this many players per second, and can run again after publishCooldownSeconds.
        publishPlayersPerSecond: 5
        publishCooldownSeconds: 30
# Terrain smoothing with a resource pack's slabs, stairs and vertical slabs (/slabsmooth, /sls). It is off in every
# world until that world's config switches modules.command.slabSmooth on. Every key is optional; the lines below,
# without their #, are the defaults. Where a loaded world has the module on, one tick after every start or reload it
# downloads the default pack's zip (the url under ServerResourcePacks, about 25 MB) and Mojang's client jar for the
# server's Minecraft version (about 37 MB), if they are not cached yet. Any other pack is downloaded the first time
# someone smooths with it. Downloads go into plugins/MCME-Architect/slabSmooth/cache/.
# To run without downloads, set download: false, put each pack's zip at
# plugins/MCME-Architect/slabSmooth/packs/<pack>.zip, and set vanilla.clientJar to the client jar of the server's
# Minecraft version. What each pack's table holds is in plugins/MCME-Architect/slabSmooth/tables/<pack>-report.txt.
#slabSmooth:
#    # The pack used where neither an RP region nor the player's own pack decides.
#    defaultPack: Human
#    download: true
#    # The inventory categories (inventories/block/<pack>/*.yml) of terrain, and of plants, which are removed or
#    # kept where the ground under them changes.
#    terrainCategories: [Terra]
#    plantCategories: [Plant, Crop]
#    # The largest difference in colour (0 to 441) between a terrain block and a piece with another texture that it
#    # may use; 0: only pieces with its own texture.
#    lookTolerance: 10
#    vanilla:
#        # A client jar to read instead of downloading one.
#        clientJar: ''
#    brush:
#        maxRadius: 12
#    selection:
#        # The most columns (x by z) and blocks a selection or area may read, with the margin read around it, and
#        # the longest it may take: a smoothing that runs out of time stops and changes nothing.
#        maxColumns: 65536
#        maxCells: 8000000
#        maxSeconds: 120
#    # Per pack, by inventory key: more blocks that count as terrain, blocks never used, and the pieces a block
#    # always uses, for example  Human: {terrain: [moss], exclude: [lava_rock], pairs: {grass: [grass_slab]}}
#    overrides: {}
#    # The settings every player starts with, by the names /sls set uses, for example  band: 3
#    defaults: {}

name: ${project.artifactId}
main: com.mcmiddleearth.architect.ArchitectPlugin
version: ${project.version}
author: Eriol_Eandur
load: STARTUP
softdepend: [ProtocolLib,Essentials,dynmap,ViaVersion,MCME-Connect]
depend: [PluginUtils]
api-version: 26.2

commands:
   parrot:
      description: Removes the parrots from your shoulders.
      usage: /parrot
   get:
      description: Kits (saved hotbars), dyed leather armor and heads.
      usage: >-
        /get [help [page]] | list [page] | <set> [-o] | pcreate|create <set> [description] |
        publish|unpublish|delete <set> | armor <RRGGBB> | head <head or category>
   fbt:
      description: Switches endless night vision on or off.
      usage: /fbt
      aliases: [fullbright, nightvision]
   vv:
      description: Lists VoxelSniper stencil lists and stencils, and deletes them.
      usage: /vv [list [folder] [page]] | stencil [folder] [page] | delete <file> | help [page]
   schlist:
      description: Lists the WorldEdit schematics on the server.
      usage: /schlist [folder] [page]
   sl:
      description: Builds VoxelSniper stencil lists.
      usage: /sl create|load <list> | add|remove <stencil or pattern> | save | show | help [page]
   random:
      description: Gives blocks around you random values of one block state, such as crop age.
      usage: >-
        /random [radius <r> | range <min> <max> | prob <p1> [p2 ...] | material <material:Attribute> ... |
        show | showAllowed | allow|deny <material:Attribute> ... | help [page]]
   banner:
      description: Banner editor; saves and loads banner designs.
      usage: /banner help
   armor:
      description: Armor stand editor; copies, saves and loads armor stands.
      usage: /armor help
   rp:
      description: Switches your resource pack and your pack settings.
      usage: >-
        /rp <pack> [-force] | check | auto [off] | reset | client <type> | variant <name> | help [page];
        admins also server | calcsha | release | dropdb | list | create | edit | remove
   itemblock:
      description: Item block counts, glow and clean-up, and item block limit regions.
      usage: >-
        /itemblock help | stats <radius> [height] | glow <radius>|off | remove <radius> [height] | list |
        create <name> | delete <name> | limit <name>|-base <n>
   inv:
      description: Opens Architect's build inventories, and manages saved inventories.
      usage: >-
        /inv [help [page]] | b [rp:<pack>] [s:<text>] | h [s:<text>] | c [rp:<pack>] |
        create|delete [rp:<pack>] <name> | reload | download <pack> | upload <pack> <description>
   nophy:
      description: Shows and edits the no-physics list, and manages its exception areas.
      usage: >-
        /nophy list <world|-default> | add|remove <world|-default> <block> |
        exception redstone|water|delete <name> | exception list [page] | help [page]
   architect:
      description: Architect's help, version, reload and admin tools.
      usage: >-
        /architect [help [page]] | version | reload | reloaddata | world | blockdata | dev | checkNBT | weather |
        eLog | placeAllBlockStates | maplayers refresh
   chunkupdate:
      description: Switches automatic block resends (the radius form does nothing in this version).
      usage: /chunkupdate [radius] | auto <world|-default> [true]
   chead:
      description: Custom heads, the head collection and its gallery.
      usage: >-
        /chead [help [page]] | warp | list [folder] [page] | submit [player|UUID|handitem] <name>;
        managers also reviewList | review | accept | reject | delete | rename | setCollection | reload | upload
   sign:
      description: Edits the sign you selected with a stick.
      usage: /sign <1-4> <text> | glow true|false
   copy:
      description: Copies your cuboid WorldEdit selection to Architect's clipboard.
      usage: /copy
      aliases: cp
   cut:
      description: Copies your cuboid WorldEdit selection to Architect's clipboard, then clears it.
      usage: /cut
      aliases: ct
   paste:
      description: Pastes Architect's clipboard; -a skips air, -b skips biomes.
      usage: /paste [-a] [-b]
      aliases: [pst, ps]
   undo:
      description: Reverts your last pastes and cuts.
      usage: /undo [n]
      aliases: [un, ud]
   redo:
      description: Restores pastes and cuts you undid.
      usage: /redo [n]
      aliases: [re, rd]
   flip:
      description: Mirrors Architect's clipboard.
      usage: /flip [x|y|z]
      aliases: [flp, fl]
   rot:
      description: Turns Architect's clipboard around the vertical axis.
      usage: /rot [90|180|270]
      aliases: rt
   viewdistance:
      description: Sets the view distance Architect tells your client.
      usage: /viewdistance <n>|default
      aliases: viewdist
   weselect:
      description: Sets the command that flint clicks put in your chat box.
      usage: /weselect <command> | shift <command> | show | reset | help [page]
      aliases: [wes]
   switchstick:
      description: Switches your stick's block-state editing on or off (it starts off).
      usage: /switchstick [help]
      aliases: [swst,ss]
   biometune:
      description: Tune biome colours and atmosphere live.
      usage: >-
        /biometune [edit] [biome|here] | info|set|unset|copy|undo|revert|save|status|preview|publish|spares|claim|label
        ... (tab completes)
permissions:
    architect.*:
        description: All of Architect's rank bundles (the Head Designer bundle and everything below it).
        default: op
        children:
            architect.ranks.headDesigner: true
    architect.ranks.headDesigner:
        description: Bundle for MCME Head Designers, with everything the Designer bundle has.
        default: op
        children:
            architect.ranks.designer: true
            architect.randomiser.allowMaterials: true
            architect.reload: true
            architect.noPhysicsList.edit: true
            architect.voxel.delete: true
            architect.customHeadManager.manager: true
            architect.armorStandEditor.delete: true
            architect.bannerEditor.delete: true
            architect.inventory.reload: true
            architect.inventory.upload: true
            architect.inventory.download: true
            architect.inventory.other: true
            architect.inventory.edit: true
            architect.get.other: true
            architect.weather: true
            architect.resourcePackAdmin: true
            architect.maplayers: true
            architect.itemBlock: true
            architect.itemBlock.remove: true
            architect.itemBlock.region.limit: true
            architect.itemBlock.region.ignore: true
            architect.itemBlock.region.create: true
    architect.ranks.designer:
        description: Bundle for MCME Designers, with everything the Artist bundle has.
        default: op
        children:
            architect.ranks.artist: true
            architect.info: true
            architect.weSchemViewer: true
            architect.voxel.viewer: true
            architect.voxel.stencilListEditor: true
            architect.randomiser.user: true
            architect.get.public: true
            architect.inventory.save: true
            architect.noPhysicsList.exception: true
            architect.copypaste: true
    architect.ranks.artist:
        description: Bundle for MCME Artists, with everything the Adventurer bundle has.
        default: op
        children:
            architect.ranks.adventurer: true
            architect.bannerEditor.save: true
            architect.armorStandEditor.trusted: true
            architect.chunkupdate: true
            architect.get.private: true
            architect.weselect: true
    architect.ranks.adventurer:
        description: Bundle for MCME Adventurers.
        default: op
        children:
            architect.hangingEntityEditor: true
            architect.bannerEditor: true
            architect.paintingEditor: true
            architect.cycleBlocks: true
            architect.armorStandEditor: true
            architect.place.halfDoor: true
            architect.place.halfBed: true
            architect.place.torch: true
            architect.place.plant: true
            architect.place.pistonExtension: true
            architect.place.burningFurnace: true
            architect.interactDragonEgg: true
            architect.fullBrightness: true
            architect.resourcePackSwitcher: true
            architect.place.doubleSlab: true
            architect.place.sixSidedLog: true
            architect.get.armor: true
            architect.get.head: true
            architect.get.plants: true
            architect.get.misc: true
            architect.get.doors: true
            architect.get.slabs: true
            architect.get.food: true
            architect.get.logs: true
            architect.getCommand: true
            architect.customHeadManager.user: true
            architect.inventory: true
            architect.inventory.open: true
            architect.help: true
            architect.noPhysicsList.view: true
            architect.signEditor: true
            architect.viewdistance: true
            architect.switchstick: true
    architect.copypaste:
        description: >-
            Use /copy, /cut, /paste, /undo, /redo, /flip and /rot. The copy size comes from
            architect.copypaste.limit.<n> or architect.copypaste.unlimited; with neither, the limit is 0 blocks.
        default: op
    architect.copypaste.unlimited:
        description: Copy and cut selections of any size.
        default: op
    architect.info:
        description: Use /architect blockdata, dev and world (/architect version needs architect.reload).
        default: op
    architect.inventory.open:
        description: Open containers whose inventoryAccess is BUILDER or EXCEPTION (with build permission).
        default: op
    architect.inventory:
        description: Use /inv to open the block, head and saved inventories.
        default: op
    architect.inventory.save:
        description: Create saved inventories with /inv create, and delete your own with /inv delete.
        default: op
    architect.inventory.other:
        description: Delete other players' saved inventories.
        default: op
    architect.inventory.reload:
        description: Reload the build inventories with /inv reload.
        default: op
    architect.inventory.upload:
        description: Upload a pack's build inventory files to GitHub with /inv upload.
        default: op
    architect.inventory.download:
        description: Download a pack's build inventory files from GitHub with /inv download.
        default: op
    architect.chunkupdate:
        description: >-
            Use /chunkupdate (its radius form does nothing in this version). /chunkupdate auto also needs
            architect.chunkupdate.auto.
        default: op
    architect.chunkupdate.auto:
        description: Switch automatic block resends with /chunkupdate auto, together with architect.chunkupdate.
        default: op
    architect.help:
        description: Use /architect help.
        default: true
    architect.reload:
        description: Use /architect reload, version, reloaddata, eLog and placeAllBlockStates.
        default: op
    architect.fullBrightness:
        description: Use /fbt (endless night vision).
        default: op
    architect.resourcePackSwitcher:
        description: Use /rp to switch your resource pack and your pack settings.
        default: op
    architect.resourcePackAdmin:
        description: Manage resource packs with /rp server, calcsha, release, dropdb and the region commands.
        default: op
        children:
            architect.resourcePackSwitcher: true
    architect.place.halfDoor:
        description: Place half doors from a door named Half...
        default: op
    architect.place.halfBed:
        description: Place half beds from a red bed named Half...
        default: op
    architect.place.torch:
        description: Place redstone torches from a torch named Unlit...
        default: op
    architect.place.doubleSlab:
        description: Not used in this version.
        default: op
    architect.place.plant:
        description: Place plants named Placeable... on any block.
        default: op
    architect.place.burningFurnace:
        description: Place a lit furnace from a furnace named Burning...
        default: op
    architect.place.pistonExtension:
        description: Place piston heads from a piston named Table... or Wheel...
        default: op
    architect.place.sixSidedLog:
        description: Not used in this version.
        default: op
    architect.interactDragonEgg:
        description: Break a dragon egg in creative mode where the dragon egg switch is on (with build permission).
        default: false
    architect.itemTexture:
        description: Not used in this version.
        default: op
    architect.itemTexture.manager:
        description: Not used in this version.
        default: op
    architect.itemBlock.remove:
        description: Remove the armor stands around you with /itemblock remove.
        default: op
    architect.itemBlock:
        description: Use /itemblock (every subcommand needs it).
        default: op
    architect.itemBlock.region.limit:
        description: Set item block limits with /itemblock limit, for regions and for the world's base limit.
        default: op
    architect.itemBlock.region.create:
        description: Create and delete item block limit regions with /itemblock create and delete.
        default: op
    architect.itemBlock.region.ignore:
        description: Place item blocks in a chunk that has reached its limit.
        default: op
    architect.get.armor:
        description: Get dyed leather armor with /get armor.
        default: op
    architect.get.logs:
        description: Not used in this version.
        default: op
    architect.get.doors:
        description: Not used in this version.
        default: op
    architect.get.plants:
        description: Not used in this version.
        default: op
    architect.get.misc:
        description: Not used in this version.
        default: op
    architect.get.food:
        description: Not used in this version.
        default: op
    architect.get.slabs:
        description: Not used in this version.
        default: op
    architect.get.head:
        description: Get heads from the head collection with /get head.
        default: op
    architect.get.public:
        description: Create public kits with /get create, and publish or unpublish kits.
        default: op
    architect.get.private:
        description: Create private kits with /get pcreate.
        default: op
    architect.get.other:
        description: Publish, unpublish and delete other players' kits.
        default: op
    architect.getCommand:
        description: Use /get to list and take kits.
        default: op
    architect.noPhysicsList.edit:
        description: Edit the no-physics list with /nophy add and remove.
        default: op
        children:
            architect.noPhysicsList.view: true
    architect.noPhysicsList.exception:
        description: Manage no-physics exception areas with /nophy exception (also needs architect.noPhysicsList.view).
        default: op
    architect.noPhysicsList.view:
        description: View the no-physics list with /nophy list.
        default: op
    architect.weSchemViewer:
        description: List the WorldEdit schematics with /schlist.
        default: op
    architect.voxel.viewer:
        description: List VoxelSniper stencils and stencil lists with /vv list and /vv stencil.
        default: op
    architect.voxel.delete:
        description: Delete VoxelSniper stencils and stencil lists with /vv delete.
        default: op
        children:
            architect.voxel.viewer: true
    architect.voxel.stencilListEditor:
        description: Build VoxelSniper stencil lists with /sl.
        default: op
    architect.bannerEditor:
        description: Use /banner and edit banners with a stick (with build permission); delete your own banner files.
        default: op
    architect.bannerEditor.save:
        description: Save banner designs with /banner save.
        default: op
        children:
            architect.bannerEditor: true
    architect.bannerEditor.delete:
        description: Delete other players' banner files.
        default: op
    architect.paintingEditor:
        description: Change a painting's motif with a stick (with build permission).
        default: op
    architect.cycleBlocks:
        description: Edit block states with a stick, and step through item block models (with build permission).
        default: op
    architect.hangingEntityEditor:
        description: >-
            Break paintings and item frames (with build permission); where hanging entity protection is on, also
            place them and use item frames.
        default: op
    architect.signEditor:
        description: Use /sign, and select a sign by left-clicking it with a stick (with build permission).
        default: op
    architect.lecternEditor:
        description: Take a lectern's book and put books on lecterns without build permission.
        default: op
    architect.armorStandEditor:
        description: Use /armor and edit armor stands with a stick; copy, paste and load saved stands.
        default: op
    architect.armorStandEditor.trusted:
        description: Save armor stands to files, and rename and delete your own files.
        default: op
        children:
            architect.armorStandEditor: true
    architect.armorStandEditor.delete:
        description: Rename and delete other players' saved armor stands.
        default: op
    architect.armorStandRollback:
        description: Use /armor rollback, which is unfinished in this version.
        default: op
    architect.randomiser.allowMaterials:
        description: Change the block states /random may set, with /random allow and deny.
        default: op
        children:
            architect.randomiser.user: true
    architect.randomiser.user:
        description: Use /random, except allow and deny.
        default: op
    architect.customHeadManager.user:
        description: Use /chead help, warp, list and submit, and take a copy of a head by clicking it with a stick.
        default: op
    architect.customHeadManager.manager:
        description: Review and manage custom heads with /chead (also needs architect.customHeadManager.user).
        default: op
    architect.weather:
        description: Change the weather with /architect weather.
        default: op
    architect.checknbt:
        description: Use /architect checkNBT.
        default: op
    architect.maplayers:
        description: Allows to redraw Architect's web-map layers with /architect maplayers refresh, and to choose the worlds of the Custom biomes layer with /architect maplayers scan
        default: op
    architect.gamemodeSwitcher:
        description: Allows to switch to every game mode with the F3+F4 switcher, without op
        default: false
        children:
            architect.gamemodeSwitcher.creative: true
            architect.gamemodeSwitcher.survival: true
            architect.gamemodeSwitcher.adventure: true
            architect.gamemodeSwitcher.spectator: true
    architect.gamemodeSwitcher.creative:
        description: Allows to switch to creative mode with the F3+F4 switcher, without op
        default: false
    architect.gamemodeSwitcher.survival:
        description: Allows to switch to survival mode with the F3+F4 switcher, without op
        default: false
    architect.gamemodeSwitcher.adventure:
        description: Allows to switch to adventure mode with the F3+F4 switcher, without op
        default: false
    architect.gamemodeSwitcher.spectator:
        description: >-
            Allows to switch to spectator mode with the F3+F4 switcher (or F3+N), without op. Always give another
            mode's permission with it: without one, a spectator cannot switch out of spectator mode.
        default: false
    architect.invisibleBlocks:
        description: Allows placing barrier, light and structure void blocks, which are invisible
        default: op
    architect.inventory.ignoreProtection:
        description: Change a container's contents without build permission where chest protection is on.
        default: op
    architect.inventory.edit:
        description: Use the in-game build inventory editor (Shift+right-click in a block inventory).
        default: op
    architect.viewdistance:
        description: Use /viewdistance.
        default: op
    architect.biomeTune:
        description: Use the biome editor and the tuning commands, and refresh your own view.
        default: op
    architect.biomeTune.admin:
        description: Add spare biomes with /biometune spares add, and the biome tuning self-test and debug commands.
        default: op
    architect.biomeTune.save:
        description: Write tuned biomes to the datapack.
        default: op
    architect.biomeTune.publish:
        description: Refresh other players after tuning (publish, and preview for someone else).
        default: op
    architect.weselect:
        description: Use /weselect.
        default: op
    architect.switchstick:
        description: Use /switchstick.
        default: op
